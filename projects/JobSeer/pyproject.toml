[project]
name = "jobseer"
version = "0.1.0"
description = "AI-powered local job pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlite-utils>=3.36",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version<'3.11'",
    "pyperclip>=1.8",
    "playwright>=1.44",
    "playwright-stealth>=1.0.6",
    "google-genai>=1.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
jobseer = "jobsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobsearch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
